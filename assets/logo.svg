<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Cosmic Crimson & Obsidian Radial Background -->
    <radialGradient id="bgOrb" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#3b0a28" />
      <stop offset="55%" stop-color="#1a0622" />
      <stop offset="100%" stop-color="#090212" />
    </radialGradient>

    <!-- Imperial Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="35%" stop-color="#f5c542" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Sacred Crimson Gradient for Siamsi Cylinder & Sticks -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Mystic Amethyst Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f051d" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Sacred Medallion -->
  <circle cx="120" cy="120" r="112" fill="url(#bgOrb)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="120" cy="120" r="103" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.8" />
  <circle cx="120" cy="120" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.45" />

  <!-- 8-Pointed Celestial Star Mandala -->
  <g stroke="url(#goldGrad)" stroke-width="1.3" fill="none" opacity="0.38">
    <rect x="62" y="62" width="116" height="116" rx="6" />
    <rect x="62" y="62" width="116" height="116" rx="6" transform="rotate(45 120 120)" />
  </g>

  <!-- Left & Right Tilted Tarot Cards Behind -->
  <g transform="translate(120, 126) rotate(-18) translate(-34, -52)">
    <rect x="0" y="0" width="56" height="88" rx="6" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="2.2" />
    <rect x="5" y="5" width="46" height="78" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="0.9" opacity="0.65" />
    <path d="M28 24 L33 36 L45 36 L35 44 L39 56 L28 48 L17 56 L21 44 L11 36 L23 36 Z" fill="url(#goldGrad)" opacity="0.85" />
  </g>

  <g transform="translate(120, 126) rotate(18) translate(-22, -52)">
    <rect x="0" y="0" width="56" height="88" rx="6" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="2.2" />
    <rect x="5" y="5" width="46" height="78" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="0.9" opacity="0.65" />
    <path d="M32 28 A14 14 0 1 0 32 56 A10 10 0 1 1 32 28 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- Center Tarot Card & Sacred Siamsi Sticks Rising -->
  <!-- Bamboo Fortune Sticks Fanning from Top -->
  <g filter="url(#goldGlow)">
    <rect x="103" y="34" width="7" height="48" rx="3" transform="rotate(-10 106 58)" fill="#fde68a" stroke="#b45309" stroke-width="1" />
    <rect x="103" y="34" width="7" height="11" rx="2" transform="rotate(-10 106 58)" fill="#ef4444" />

    <rect x="116.5" y="28" width="7" height="52" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1" />
    <rect x="116.5" y="28" width="7" height="12" rx="2" fill="#ef4444" />

    <rect x="130" y="34" width="7" height="48" rx="3" transform="rotate(10 133 58)" fill="#fde68a" stroke="#b45309" stroke-width="1" />
    <rect x="130" y="34" width="7" height="11" rx="2" transform="rotate(10 133 58)" fill="#ef4444" />
  </g>

  <!-- Center Foreground Sacred Tarot Card / Siamsi Emblem -->
  <g transform="translate(86, 66)">
    <rect x="0" y="0" width="68" height="106" rx="8" fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="2.8" />
    <rect x="6" y="6" width="56" height="94" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85" />
    <!-- All-Seeing Sun & Mystic Eye inside Center Emblem -->
    <circle cx="34" cy="46" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    <path d="M18 46 Q34 32 50 46 Q34 60 18 46 Z" fill="#1a0622" stroke="url(#goldGrad)" stroke-width="1.8" />
    <circle cx="34" cy="46" r="5.5" fill="url(#goldGrad)" />
    <!-- Sacred Thai/Chinese Divination Seal Base -->
    <rect x="16" y="74" width="36" height="14" rx="4" fill="#1a0622" stroke="url(#goldGrad)" stroke-width="1.2" />
    <text x="34" y="84" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="9" font-weight="bold">靈籤 • TAROT</text>
  </g>

  <!-- Top & Bottom Sparkle Stars -->
  <circle cx="120" cy="18" r="3" fill="#fff3b0" />
  <circle cx="120" cy="222" r="3" fill="#fff3b0" />
  <circle cx="18" cy="120" r="3" fill="#fff3b0" />
  <circle cx="222" cy="120" r="3" fill="#fff3b0" />
</svg>
